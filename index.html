<style>
:root{
  --ink:#1c2530; --ink2:#3d4f61; --ink3:#7a8fa6;
  --rule:#e2e8ef; --bg:#f4f6f9; --card:#fff; --tint:#f0f5fb;
  --blue:#1d5fa8; --blue-d:#174d8a; --blue-lt:#e8f1fb;
  --green:#0d6e4b; --green-lt:#e6f5ee;
  --red:#b52a2a; --red-lt:#fdecec;
  --amber:#8a5a00; --amber-lt:#fdf6e3;
  --navy:#0d1f35;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --hdr:52px; --nav:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100vw}
body{
  font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;color:inherit}
img{display:block}
.hide{display:none !important}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ═══ Header ═══ */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(var(--hdr) + var(--sat));padding:var(--sat) 12px 0;
  background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:10px;
  border-bottom:2px solid var(--blue);
}
header .logo{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;flex-shrink:0}
header h1{font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
header .spacer{flex:1}
.iconbtn{
  background:none;border:none;color:rgba(255,255,255,.85);
  width:38px;height:38px;border-radius:9px;font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.iconbtn:active{background:rgba(255,255,255,.12)}

/* sync pill */
#syncPill{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);
  white-space:nowrap;cursor:pointer;border:none;
}
#syncPill.ok{background:rgba(46,204,113,.2);color:#7ff0b5}
#syncPill.pend{background:rgba(241,196,15,.22);color:#ffdf7e}
#syncPill.err{background:rgba(231,76,60,.25);color:#ffb3ab}
#syncPill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
#syncPill.pend .dot{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ═══ Shell ═══ */
.shell{
  padding-top:calc(var(--hdr) + var(--sat));
  padding-bottom:calc(var(--nav) + var(--sab) + 8px);
  min-height:100vh;min-height:100dvh;
}
.page{padding:14px 12px;max-width:1180px;margin:0 auto}
.page-title{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:2px}
.page-sub{font-size:12px;color:var(--ink3);margin-bottom:14px}

/* ═══ Bottom nav (mobile) ═══ */
#bottomNav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);
  background:#fff;border-top:1px solid var(--rule);
  display:flex;box-shadow:0 -2px 12px rgba(13,31,53,.06);
}
#bottomNav button{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);font-size:10.5px;font-weight:500;padding:0;
}
#bottomNav button .ic{font-size:19px;line-height:1}
#bottomNav button.active{color:var(--blue);font-weight:700}
#bottomNav button:active{background:var(--tint)}

/* ═══ Desktop sidebar ═══ */
#sideNav{display:none}

/* ═══ Cards ═══ */
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:10px}
.card.flat{padding:0;overflow:hidden}

/* ═══ Buttons ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  font-size:14px;font-weight:600;cursor:pointer;background:#fff;
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:active{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--rule);color:var(--ink2)}
.btn-ghost:active{background:var(--tint)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:15px 20px;font-size:16px;border-radius:12px;width:100%}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ═══ Chips ═══ */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{
  padding:9px 14px;border-radius:22px;border:1px solid var(--rule);
  background:#fff;color:var(--ink2);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.chip:active{background:var(--tint)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.chip .cnt{opacity:.65;font-size:11px;margin-left:4px}

/* ═══ Badge ═══ */
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.3px}
.bA{background:#dbeafe;color:#1e40af}
.bB{background:#dcfce7;color:#166534}
.bC{background:#ede9fe;color:#5b21b6}
.pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;background:var(--navy);color:#fff}
.pill.g{background:var(--green)}
.pill.a{background:var(--amber)}

/* ═══ Search ═══ */
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{
  width:100%;padding:13px 40px 13px 40px;border:1px solid var(--rule);
  border-radius:11px;font-size:16px;background:#fff;
}
.searchbar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,168,.1)}
.searchbar .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px;pointer-events:none}
.searchbar .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--ink3);font-size:17px;width:32px;height:32px;cursor:pointer;border-radius:50%}

/* ═══ Item row (tap target) ═══ */
.itemrow{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:#fff;border:1px solid var(--rule);border-radius:11px;margin-bottom:7px;
  cursor:pointer;text-align:left;width:100%;
}
.itemrow:active{background:var(--tint);border-color:#c3d4e6}
.itemrow .thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--rule);flex-shrink:0;background:var(--bg)}
.itemrow .nothumb{width:42px;height:42px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.itemrow .body{flex:1;min-width:0}
.itemrow .t1{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemrow .t2{font-size:11.5px;color:var(--ink3);margin-top:1px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.itemrow .right{text-align:right;flex-shrink:0}
.itemrow .qty{font-size:14px;font-weight:800;color:var(--blue)}
.itemrow .qsub{font-size:11px;color:var(--ink3)}

/* ═══ Sheet (bottom modal) ═══ */
.sheet-bg{
  position:fixed;inset:0;z-index:200;background:rgba(8,18,32,.55);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  background:#fff;width:100%;max-width:560px;max-height:92dvh;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  padding-bottom:var(--sab);
}
.sheet-bg.open .sheet{transform:translateY(0)}
.sheet-head{
  padding:12px 16px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;
}
.sheet-head::before{
  content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:3px;background:var(--rule);
}
.sheet-head .st{flex:1;min-width:0}
.sheet-head .st1{font-size:15px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .st2{font-size:11.5px;color:var(--ink3)}
.sheet-body{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--rule);flex-shrink:0;display:flex;gap:8px}
.sheet-foot .btn{flex:1}

/* ═══ Field ═══ */
.fld{margin-bottom:14px}
.fld > label{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:10px;
  font-size:16px;background:#fff;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,168,.1)}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ═══ Numpad ═══ */
.qtybox{
  background:var(--navy);border-radius:14px;padding:14px 16px;margin-bottom:12px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.qtybox .val{font-size:34px;font-weight:800;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.qtybox .val.ph{color:rgba(255,255,255,.3)}
.qtybox .unit{font-size:15px;font-weight:600;color:rgba(255,255,255,.65)}
.qtybox .kg{font-size:12.5px;color:#7fc4ff;font-weight:600;text-align:right}
.qtybox .kg.warn{color:#ffce6b}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numpad button{
  padding:0;height:56px;border:1px solid var(--rule);border-radius:12px;
  background:#fff;font-size:22px;font-weight:600;cursor:pointer;color:var(--ink);
}
.numpad button:active{background:var(--tint)}
.numpad button.act{background:var(--tint);color:var(--red);font-size:19px}

/* ═══ Photos ═══ */
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos .ph{position:relative;width:66px;height:66px;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1;
}
.addph{
  width:66px;height:66px;border-radius:10px;border:1.5px dashed var(--rule);
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10.5px;color:var(--ink3);cursor:pointer;
}
.addph .ic{font-size:18px}

/* ═══ Lightbox ═══ */
#lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px}
#lightbox .x{position:absolute;top:calc(12px + var(--sat));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px;cursor:pointer}

/* ═══ Toast ═══ */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--nav) + var(--sab) + 14px);z-index:500;
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;
  font-size:13px;font-weight:600;max-width:92vw;text-align:center;
  box-shadow:0 6px 24px rgba(8,18,32,.28);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#8f1f1f}
#toast.warn{background:#7a4d00}

/* ═══ Loader ═══ */
#boot{position:fixed;inset:0;z-index:900;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#boot img{width:82px;height:82px;border-radius:16px;background:#fff;padding:6px;object-fit:contain}
#boot .bt{color:#fff;font-size:15px;font-weight:700}
#boot .bs{color:rgba(255,255,255,.55);font-size:12px}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:#4a9eff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busy{position:fixed;inset:0;z-index:600;background:rgba(13,31,53,.4);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#busy.on{display:flex}
#busy .bm{color:#fff;font-size:13px}

/* ═══ Empty ═══ */
.empty{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty .ei{font-size:42px;opacity:.28;margin-bottom:10px}
.empty .et{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.empty .es{font-size:12px;max-width:270px;margin:0 auto;line-height:1.6}

/* ═══ Table (desktop) ═══ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:11px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl thead{background:var(--navy)}
table.tbl th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--tint)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ═══ KPI ═══ */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.kpi{background:var(--navy);color:#fff;border-radius:12px;padding:13px 10px;text-align:center}
.kpi.b2{background:#1a5276}
.kpi.b3{background:var(--green)}
.kpi .n{font-size:20px;font-weight:800;line-height:1.15}
.kpi .l{font-size:10px;opacity:.68;margin-top:3px;letter-spacing:.3px}

/* ═══ Rows / lists ═══ */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--rule)}
.lrow:first-child{border-top:none}
.lrow .l1{font-size:13.5px;font-weight:600;color:var(--ink)}
.lrow .l2{font-size:11.5px;color:var(--ink3)}
.lrow .rv{font-size:13.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.sec-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 13px;background:var(--tint);border-bottom:1px solid var(--rule);
}
.sec-head .sh1{font-size:13px;font-weight:700;color:var(--navy)}
.sec-head .sh2{font-size:11.5px;color:var(--ink3)}

.note{background:var(--amber-lt);border:1px solid #f0d9a0;border-radius:9px;padding:9px 12px;font-size:12px;color:var(--amber);margin-bottom:10px}
.note.info{background:var(--blue-lt);border-color:#c5ddf5;color:var(--blue)}
.note.ok{background:var(--green-lt);border-color:#b6e3cd;color:var(--green)}

.stale{color:var(--amber);font-weight:600}

/* ═══ Pagination ═══ */
.pager{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pager button{padding:8px 13px;border:1px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pager button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pager button:disabled{opacity:.35}

/* ═══ Login ═══ */
#login{position:fixed;inset:0;z-index:800;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:22px}
#login .box{width:100%;max-width:340px}
#login .lg{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px}
#login .lg img{width:84px;height:84px;border-radius:16px;background:#fff;padding:6px;object-fit:contain}
#login h2{color:#fff;font-size:17px;font-weight:700}
#login p{color:rgba(255,255,255,.45);font-size:12px;text-align:center}
#login label{display:block;color:rgba(255,255,255,.55);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
#login input{width:100%;padding:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:16px;color:#fff;margin-bottom:12px}
#login input::placeholder{color:rgba(255,255,255,.3)}
#login input:focus{outline:none;border-color:#4a9eff}

/* ═══ Desktop ═══ */
@media (min-width:900px){
  body{font-size:13.5px}
  #bottomNav{display:none}
  .shell{padding-bottom:20px;padding-left:230px}
  #sideNav{
    display:block;position:fixed;top:calc(var(--hdr) + var(--sat));left:0;bottom:0;width:230px;
    background:var(--navy);overflow-y:auto;z-index:50;padding:8px 0;
  }
  #sideNav button{
    width:100%;display:flex;align-items:center;gap:10px;padding:11px 20px;
    background:none;border:none;border-left:3px solid transparent;
    color:rgba(255,255,255,.55);font-size:13.5px;cursor:pointer;text-align:left;
  }
  #sideNav button:hover{color:#fff;background:rgba(255,255,255,.05)}
  #sideNav button.active{color:#fff;background:rgba(29,95,168,.35);border-left-color:#4a9eff;font-weight:600}
  #sideNav .grp{padding:14px 20px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px}
  .page{padding:22px}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-height:88vh}
  .sheet-bg .sheet{transform:translateY(16px) scale(.98)}
  .sheet-bg.open .sheet{transform:none}
  #toast{bottom:22px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .hide-desk{display:none !important}
}
@media (max-width:899px){ .hide-mob{display:none !important} }

/* ═══ Print ═══ */
@media print{
  @page{margin:14mm 11mm;size:A4}
  body{background:#fff;font-size:11px}
  header,#bottomNav,#sideNav,#toast,#busy,.no-print,.btn,.searchbar,.pager,
  #view,#login,#boot,.sheet-bg,#lightbox{display:none !important}
  .shell{padding:0}
  .page{padding:0;max-width:none}
  #printArea{display:block !important}
  table{border-collapse:collapse}
  tr{page-break-inside:avoid}
  thead{display:table-header-group}
}
#printArea{display:none}

      <p>ระบบนับสต็อกวัตถุดิบ</p>
    </div>
    <label for="loginName">ชื่อผู้บันทึก</label>
    <input id="loginName" type="text" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น" maxlength="50" autocomplete="name">
    <button class="btn btn-primary btn-lg" data-act="login">เข้าใช้งาน</button>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   SPM Inventory — v2 (mobile-first, snapshot stock model)
   โครงสร้างข้อมูล:
     S.items[]   = ทะเบียนวัตถุดิบ (ชีต Items)
     S.entries[] = รายการนับสต็อก แต่ละแถวมี eid ไม่ซ้ำ (ชีต Daily)
   นิยามสต็อกคงเหลือ (Snapshot):
     ยอดของ (สินค้า + Location) = ผลรวมของ "วันที่นับล่าสุด" ของคู่นั้น
     นับซ้ำในวันเดียวกัน = บวกกัน (หลายกอง)  |  ข้ามวัน = แทนที่
   ════════════════════════════════════════════════════════════════ */

/* ── config ───────────────────────────────────────────────────── */
function _d(h){return h.match(/../g).map(b=>String.fromCharCode(parseInt(b,16)^42)).join('');}
const CFG = {
  // หมายเหตุความปลอดภัย: การเข้ารหัสนี้กันคนทั่วไปเห็นเฉยๆ ไม่ใช่ระบบรักษาความปลอดภัย
  // ใครเปิดดูซอร์สโค้ดก็ถอดได้ — การตรวจสิทธิ์จริงต้องทำที่ฝั่ง Apps Script
  URL   : _d('425e5e5a59100505594958435a5e044d45454d464f0449454705474b495845590559056b614c534948524247501a5860605a1b58647f1d6f491f6b501d476b7f5b7913755d43197f73755f67681b5e7d5c195f7b40136b6f6712604c464360074c44627d5243667a6c1d4b054f524f49'),
  TOKEN : _d('797a67756c6f6f6e6763666675181a181e'),
  TIMEOUT     : 25000,
  PAGE        : 25,
  MAX_PHOTOS  : 2,
  PHOTO_BYTES : 11000,
  PHOTO_EDGE  : 640,
  SYNC_DELAY  : 2000,
  BACKOFF     : [3000, 8000, 20000, 45000, 90000],
  KEEP_DAYS   : 400,
  STALE_DAYS  : 14
};

const CODE_MAP = {
  A001:'Raw Materials', A002:'Liquid & Oil', A003:'Vitamin & Mineral',
  A004:'Feed Additive', A005:'Medicine', A009:'Production for trial',
  A020:'Raw Materials for sale - Bulk', A021:'Raw Materials for sale - Bag',
  B101:'Semi - RM', B102:'WIP Premix', B103:'WIP ขนมชั้น',
  C203:'NC - FG Bulk', C204:'NC - FG Bag', C209:'NC สารเสริม'
};
const LOCATIONS = ['โรงงาน 1','โรงงาน 2','โรงงาน 3','โรงงาน 4','คลังวัตถุดิบ','คลังเคมีภัณฑ์'];

/* หน่วย: kg = น้ำหนักมาตรฐานต่อหน่วย (null = ต้องกรอกเอง)
   ทุกหน่วยกรอก กก./หน่วย เองได้ทั้งหมด → แปลงเป็น กก. ได้ครบ ไม่มีแถวตกหล่นอีก */
const UNITS = [
  {v:'กก.',    label:'กก.',      kg:1,    fixed:true },
  {v:'กระสอบ', label:'กระสอบ',   kg:null },
  {v:'bigbag', label:'บิ๊กแบ็ค', kg:1000 },
  {v:'ตัน',    label:'ตัน',      kg:1000, fixed:true },
  {v:'ถัง',    label:'ถัง',      kg:null },
  {v:'เบาท์',  label:'เบาท์',    kg:null }
];
const UNIT_MAP = Object.fromEntries(UNITS.map(u=>[u.v,u]));
const PKG_MAP  = {'':'- ไม่ระบุ -', bulk:'เบาท์ (Bulk)', bag:'กระสอบ (Bag)', drum:'ถัง (Drum)'};
const COND_OPTS= ['','รับน้ำหนักตามใบชั่ง','รับน้ำหนักตามบิล','อื่นๆ'];
const TH_MONTH = 'มกราคม กุมภาพันธ์ มีนาคม เมษายน พฤษภาคม มิถุนายน กรกฎาคม สิงหาคม กันยายน ตุลาคม พฤศจิกายน ธันวาคม'.split(' ');
const TH_MON_S = 'ม.ค. ก.พ. มี.ค. เม.ย. พ.ค. มิ.ย. ก.ค. ส.ค. ก.ย. ต.ค. พ.ย. ธ.ค.'.split(' ');

/* ── DOM helpers ──────────────────────────────────────────────── */
const $  = id => document.getElementById(id);
const qs = (s,r) => (r||document).querySelector(s);
function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* attr(): ใช้กับค่าที่จะไปอยู่ใน data-* เท่านั้น (ไม่มี inline onclick ทั้งไฟล์ = ไม่มีช่อง XSS) */
const attr = v => esc(v);

/* ── number / date ────────────────────────────────────────────── */
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : NaN;
  if(v == null) return NaN;
  const n = parseFloat(String(v).replace(/[, ]/g,''));
  return isFinite(n) ? n : NaN;
}
function r2(n){ const x = num(n); return isFinite(x) ? Math.round(x*100)/100 : 0; }
function fmt(n,d){
  const x = num(n); if(!isFinite(x)) return '-';
  return x.toLocaleString('en-US',{maximumFractionDigits:d==null?2:d});
}
const pad2 = n => String(n).padStart(2,'0');
/* วันที่ตามเวลาเครื่อง (ไม่ใช่ UTC) — แก้บั๊กบันทึกช่วงเช้าแล้วไปลงเมื่อวาน */
function localDate(d){ d = d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function normDate(v){
  if(!v) return '';
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  const d = new Date(s);
  return isNaN(d.getTime()) ? '' : localDate(d);
}
function thDate(ds,short){
  const p = String(ds||'').split('-');
  const y = +p[0], m = +p[1], d = +p[2];
  if(!y||!m||!d) return ds||'-';
  return d+' '+((short?TH_MON_S:TH_MONTH)[m-1]||'')+' '+(y+543);
}
function thMonth(ym){ const p=String(ym||'').split('-'); return (TH_MONTH[+p[1]-1]||'')+' '+(+p[0]+543); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* No. ในชีตอาจโดน Sheets แปลงเป็นตัวเลขจน 0 นำหน้าหาย -> เติมกลับให้ครบ 6 หลัก
   (ฝั่ง Apps Script ทำแบบเดียวกันใน _normEntryNo) */
function normNo(v){
  const s = String(v==null?'':v).trim();
  return (/^\d+$/.test(s) && s.length < 6) ? s.padStart(6,'0') : s;
}

/* ชื่อ location มาตรฐาน: โรง1 / โรงงาน1 / โรงงาน 1 → "โรงงาน 1" */
function normLoc(v){
  if(!v) return '';
  let s = String(v).trim().replace(/\s+/g,' ');
  return s.replace(/^โรง(?:งาน)?\s*(\d+)$/i,'โรงงาน $1');
}

/* ── แปลงหน่วยเป็น กก. (จุดเดียวของทั้งระบบ) ────────────────────
   คืน number = แปลงได้  |  null = ไม่รู้น้ำหนักต่อหน่วย            */
function toKg(qty, unit, kgPerUnit, item){
  const q = num(qty); if(!isFinite(q)) return null;
  if(unit === 'กก.' || unit === 'kg') return r2(q);
  let w = num(kgPerUnit);
  if(!(w>0)){ const u = UNIT_MAP[unit]; if(u && u.kg) w = u.kg; }
  if(!(w>0) && item) w = num(item.col2);
  if(!(w>0)) return null;
  return r2(q*w);
}
/* น้ำหนักต่อหน่วยที่ "จะใช้จริง" — ไว้โชว์ให้ผู้ใช้เห็น */
function wpuOf(unit, kgPerUnit, item){
  if(unit === 'กก.' || unit === 'kg') return 1;
  let w = num(kgPerUnit);
  if(!(w>0)){ const u = UNIT_MAP[unit]; if(u && u.kg) w = u.kg; }
  if(!(w>0) && item) w = num(item.col2);
  return w>0 ? w : null;
}
/* รวม กก. จากหลายแถว + บอกจำนวนแถวที่แปลงไม่ได้ (ไม่เอาจำนวนดิบมาบวกมั่ว) */
function sumKg(rows){
  let kg = 0, skipped = 0;
  for(const e of rows){
    const k = toKg(e.qty, e.unit, e.kgPerUnit, itemOf(e.no));
    if(k === null) skipped++; else kg = r2(kg + k);
  }
  return {kg, skipped};
}

/* ── state ────────────────────────────────────────────────────── */
const S = {
  user      : '',
  items     : [],
  byNo      : new Map(),
  entries   : [],
  byEid     : new Map(),
  dirty     : new Set(),   // eid ที่รอส่งขึ้น Sheet
  removed   : new Set(),   // eid ที่ลบแล้วรอแจ้ง Sheet
  ver       : 1,           // เวอร์ชัน backend ที่ตรวจพบ
  online    : navigator.onLine,
  syncing   : false,
  syncErr   : '',
  tries     : 0,
  lastSync  : 0,
  loaded    : false,
  page      : 'count',
  prefs     : {},          // จำ location/หน่วยล่าสุดต่อสินค้า
  _cache    : {}
};
function bump(){ S._cache = {}; }
const itemOf = no => S.byNo.get(String(no)) || null;

function reindex(){
  S.byNo = new Map();
  for(const it of S.items) S.byNo.set(it.no, it);
  S.byEid = new Map();
  for(const e of S.entries) S.byEid.set(e.eid, e);
  bump();
}

/* ── local storage (ทนต่อพื้นที่เต็ม) ──────────────────────────── */
const LS = {
  get(k,def){ try{ const v = localStorage.getItem('spm.'+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem('spm.'+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('spm.'+k); }catch(e){} }
};
function saveLocal(){
  const payload = S.entries;
  if(LS.set('entries', payload)) { LS.set('meta',{ver:S.ver,ts:Date.now()}); return; }
  // พื้นที่เต็ม → ตัดรูปของรายการที่ซิงก์แล้วออกจากแคชในเครื่อง (ตัวจริงอยู่บน Sheet แล้ว)
  const slim = S.entries.map(e => (S.dirty.has(e.eid) || !(e.photos||[]).length)
    ? e : Object.assign({}, e, {photos:[], _photoDropped:true}));
  if(LS.set('entries', slim)) { toast('พื้นที่เครื่องเต็ม — ล้างแคชรูปออกแล้ว','warn'); return; }
  // ยังไม่พอ → เก็บเฉพาะรายการล่าสุด
  const cut = localDate(new Date(Date.now() - 60*86400000));
  const recent = slim.filter(e => e.date >= cut || S.dirty.has(e.eid));
  if(!LS.set('entries', recent)) toast('บันทึกลงเครื่องไม่สำเร็จ (พื้นที่เต็ม)','err');
}
function saveQueue(){ LS.set('queue',{d:[...S.dirty], r:[...S.removed]}); }
function loadQueue(){ const q = LS.get('queue',{d:[],r:[]}); S.dirty = new Set(q.d||[]); S.removed = new Set(q.r||[]); }

/* ── network ──────────────────────────────────────────────────── */
async function req(params, body){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), CFG.TIMEOUT);
  try{
    let res;
    if(body){
      res = await fetch(CFG.URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({token:CFG.TOKEN}, body)),
        redirect:'follow', signal:ctrl.signal
      });
    }else{
      const q = new URLSearchParams(Object.assign({token:CFG.TOKEN}, params));
      res = await fetch(CFG.URL+'?'+q, {redirect:'follow', signal:ctrl.signal});
    }
    const txt = await res.text();
    let j;
    try{ j = JSON.parse(txt); }
    catch(e){ throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ (อาจต้องตั้งสิทธิ์ Apps Script เป็น Anyone)'); }
    if(j.ok === false || j.result === 'error') throw new Error(j.error || 'เซิร์ฟเวอร์แจ้งข้อผิดพลาด');
    if(j.result === 'unauthorized') throw new Error('ไม่มีสิทธิ์เข้าถึง (token ไม่ถูกต้อง)');
    return j;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('หมดเวลาเชื่อมต่อ');
    throw e;
  }finally{ clearTimeout(t); }
}

/* ตรวจว่า backend เป็น v2 (มี action ใหม่) หรือ v1 (ของเดิม) */
async function detectVersion(){
  try{
    const j = await req({action:'ping'});
    const d = (j && j.data) || j || {};
    S.ver = (String(d.version) === '2') ? 2 : 1;
  }catch(e){ S.ver = 1; }
  return S.ver;
}

/* ==================================================================
   SYNC ENGINE - local-first + คิวรอส่ง (ทำงานต่อได้ตอนเน็ตหลุด)
   ================================================================== */
let _syncTimer = null, _retryTimer = null;

function markDirty(eid){ S.dirty.add(eid); saveQueue(); saveLocal(); scheduleSync(); paintSync(); }
function markRemoved(eid, date){
  S.dirty.delete(eid); S.removed.add(eid);
  LS.set('rmdate.'+eid, date||'');
  saveQueue(); saveLocal(); scheduleSync(); paintSync();
}

function scheduleSync(delay){
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>flush(), delay==null?CFG.SYNC_DELAY:delay);
}
function pendingCount(){ return S.dirty.size + S.removed.size; }

function paintSync(){
  const pill = $('syncPill'), txt = $('syncTxt');
  if(!pill) return;
  const n = pendingCount();
  pill.className = '';
  if(!S.online){ pill.classList.add('pend'); txt.textContent = n ? 'ออฟไลน์ '+n : 'ออฟไลน์'; }
  else if(S.syncing){ pill.classList.add('pend'); txt.textContent = 'กำลังส่ง'+(n?' '+n:''); }
  else if(n){ pill.classList.add(S.syncErr?'err':'pend'); txt.textContent = 'รอส่ง '+n; }
  else if(S.syncErr){ pill.classList.add('err'); txt.textContent = 'ผิดพลาด'; }
  else { pill.classList.add('ok'); txt.textContent = 'ซิงก์แล้ว'; }
}

/* อัปโหลดรูปขึ้น Drive (เฉพาะ backend v2) แล้วแทน data:URL ด้วยลิงก์ => payload เล็กลงมาก */
async function liftPhotos(entries){
  if(S.ver < 2) return;
  for(const e of entries){
    if(!e.photos || !e.photos.length) continue;
    const out = [];
    for(const p of e.photos){
      if(typeof p === 'string' && p.indexOf('data:') === 0){
        try{
          const j = await req(null, {action:'uploadPhoto', data:p, name:e.no+'_'+e.date+'_'+uid()});
          const u = ((j && j.data) || j || {}).url;
          out.push(u || p);
        }catch(err){ out.push(p); }   /* อัปไม่ได้ก็เก็บ base64 ต่อ ไม่ทำให้บันทึกล้ม */
      }else out.push(p);
    }
    e.photos = out;
  }
}

async function flush(force){
  if(S.syncing || !S.loaded) return;
  if(!pendingCount()){ S.syncErr=''; paintSync(); return; }
  if(!S.online && !force){ paintSync(); return; }

  S.syncing = true; S.syncErr = ''; paintSync();
  const dirtyIds = [...S.dirty], removedIds = [...S.removed];
  try{
    const rows = dirtyIds.map(id => S.byEid.get(id)).filter(Boolean);
    await liftPhotos(rows);

    if(S.ver >= 2){
      if(rows.length) await req(null, {action:'upsertEntries', recorded_by:S.user, entries:rows.map(toWire)});
      if(removedIds.length) await req(null, {action:'deleteEntries', eids:removedIds});
    }else{
      /* backend เดิม: เขียนทับทีละวัน */
      const dates = new Set();
      rows.forEach(e=>dates.add(e.date));
      removedIds.forEach(id=>{ const d = LS.get('rmdate.'+id,''); if(d) dates.add(d); });
      for(const d of dates){
        const dayRows = S.entries.filter(e=>e.date===d);
        if(dayRows.length){
          await req(null, {action:'saveDaily', date:d, date_th:thDate(d),
            recorded_by:S.user, entries:dayRows.map(toWire)});
        }else{
          await req(null, {action:'deleteDailyDate', date:d});
        }
      }
    }
    removedIds.forEach(id=>LS.del('rmdate.'+id));
    dirtyIds.forEach(id=>S.dirty.delete(id));
    removedIds.forEach(id=>S.removed.delete(id));
    S.tries = 0; S.lastSync = Date.now(); S.syncErr = '';
    saveQueue(); saveLocal();
  }catch(e){
    S.syncErr = e.message || 'ส่งข้อมูลไม่สำเร็จ';
    const wait = CFG.BACKOFF[Math.min(S.tries, CFG.BACKOFF.length-1)];
    S.tries++;
    clearTimeout(_retryTimer);
    _retryTimer = setTimeout(()=>flush(), wait);
  }finally{
    S.syncing = false; paintSync();
  }
}

/* รูปแบบที่ส่งขึ้นชีต (ใส่ทั้งชื่อคีย์เก่าและใหม่ เพื่อให้ใช้ได้กับสคริปต์เดิม) */
function toWire(e){
  return {
    _eid:e.eid, eid:e.eid, date:e.date, date_th:thDate(e.date), recorded_by:e.by||S.user,
    code:e.code, no:e.no, desc:e.desc,
    location:e.location, storage:e.storage||'',
    qty:e.qty, unit:e.unit, kgPerUnit:e.kgPerUnit||'',
    note:e.note||'', images:e.photos||[], photos:e.photos||[],
    updated_at:e.ts||Date.now()
  };
}
/* รับจากชีต -> รูปแบบภายใน (รองรับทั้งชื่อคอลัมน์เก่าและใหม่) */
function fromWire(r, day){
  const photos = Array.isArray(r.photos) ? r.photos
               : Array.isArray(r.images) ? r.images
               : (typeof r.photos === 'string' && r.photos) ? tryJson(r.photos)
               : (typeof r.images === 'string' && r.images) ? tryJson(r.images)
               : (r.image ? [r.image] : []);
  const no = normNo(r.no != null ? r.no : (r['No.'] != null ? r['No.'] : ''));
  return {
    eid      : String(r._eid || r.eid || uid()),
    date     : normDate(r.date || (day && day.date)),
    no       : no,
    code     : String(r.code || r.Code || '').trim(),
    desc     : String(r.desc || r.Description || ''),
    location : normLoc(r.location || ''),
    storage  : String(r.storage || r['สถานที่จัดเก็บ'] || ''),
    qty      : num(r.qty),
    unit     : String(r.unit || '').trim(),
    kgPerUnit: (r.kgPerUnit === '' || r.kgPerUnit == null) ? '' : String(r.kgPerUnit),
    note     : String(r.note || ''),
    photos   : (photos||[]).filter(Boolean),
    by       : String(r.recorded_by || (day && day.recorded_by) || ''),
    ts       : num(r.updated_at) || 0
  };
}
function tryJson(s){ try{ const v = JSON.parse(s); return Array.isArray(v)?v:[String(s)]; }catch(e){ return s?[s]:[]; } }

/* ==================================================================
   LOAD - เอาข้อมูลในเครื่องขึ้นก่อน แล้วค่อยรวมกับของเซิร์ฟเวอร์
   (ของที่ยังไม่ซิงก์จะไม่ถูกทับ = ไม่มีข้อมูลหายเงียบอีก)
   ================================================================== */
function normItems(rows){
  return rows.map((r,i)=>({
    row  : num(r._row) || i+2,
    code : String(r.Code || r.code || '').trim(),
    no   : normNo(r['No.'] != null ? r['No.'] : (r.no||'')),
    desc : String(r.Description || r.desc || ''),
    pkg  : String(r['บรรจุ'] || r.pkg || ''),
    col2 : r['นน./หน่วย'] != null ? String(r['นน./หน่วย']) : String(r.col2||''),
    cond : String(r['เงื่อนไขการซื้อขาย'] || r.cond || ''),
    loc  : String(r.location || r.loc || ''),
    storage: String(r['สถานที่จัดเก็บ'] || r.storage || ''),
    image : String(r.pic  || r.image  || ''),
    image2: String(r.pic2 || r.image2 || ''),
    notes : String(r['หมายเหตุ'] || r.notes || '')
  })).filter(it=>it.no);
}

async function loadAll(){
  let items = [], entries = [];
  await detectVersion();

  if(S.ver >= 2){
    const j = await req({action:'bootstrap'});
    const d = (j && j.data) || j || {};
    items   = d.items || [];
    entries = (d.entries || []).map(r=>fromWire(r));
  }else{
    const ji = await req({action:'getItems'});
    items = ji.data || [];
    let jd = {data:[]};
    try{ jd = await req({action:'getDaily'}); }catch(e){}
    (jd.data||[]).forEach(day=>{ (day.entries||[]).forEach(r=>entries.push(fromWire(r, day))); });
  }

  S.items = normItems(items);
  LS.set('items', S.items);
  reindex();

  /* merge: รายการที่ยังอยู่ในคิว (ยังไม่ส่ง) ให้ของในเครื่องชนะ */
  const local = LS.get('entries', []) || [];
  const keepLocal = local.filter(e => S.dirty.has(e.eid));
  const keepIds = new Set(keepLocal.map(e=>e.eid));
  S.entries = entries
    .filter(e => !keepIds.has(e.eid) && !S.removed.has(e.eid))
    .concat(keepLocal)
    .filter(e => e.date && e.no)
    .map(e => { if(!e.desc){ const it = itemOf(e.no); if(it) e.desc = it.desc; } return e; })
    .sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : 0);

  reindex();
  S.loaded = true;
  saveLocal();
  paintSync();
  if(pendingCount()) scheduleSync(800);
}

/* โหลดจากเครื่องก่อน (แสดงผลทันทีแม้เน็ตช้า/ไม่มีเน็ต) */
function loadLocalFirst(){
  const items = LS.get('items', []) || [];
  const ents  = LS.get('entries', []) || [];
  if(items.length) S.items = items;
  if(ents.length)  S.entries = ents;
  reindex();
  return items.length > 0;
}

/* ==================================================================
   SNAPSHOT - สต็อกคงเหลือ = ยอดของ "วันที่นับล่าสุด" ต่อ สินค้า+Location
   ================================================================== */
const KEYSEP = '\\u0001';
function snapshot(){
  if(S._cache.snap) return S._cache.snap;
  const byKey = new Map();                 /* no|loc -> {date, rows[]} */
  for(const e of S.entries){
    if(!e.date || !e.no) continue;
    const key = e.no + KEYSEP + (e.location||'ไม่ระบุ');
    const cur = byKey.get(key);
    if(!cur || e.date > cur.date) byKey.set(key, {date:e.date, rows:[e]});
    else if(e.date === cur.date) cur.rows.push(e);
  }
  const byNo = new Map();
  for(const [key,v] of byKey){
    const parts = key.split(KEYSEP);
    const no = parts[0], loc = parts[1];
    let rec = byNo.get(no);
    if(!rec){ rec = {no, locs:[], totalKg:0, skipped:0, lastDate:''}; byNo.set(no, rec); }
    const it = itemOf(no);
    const byUnit = new Map();
    for(const r of v.rows){
      const u = r.unit || '-';
      const cur = byUnit.get(u) || {unit:u, qty:0, kgPerUnit:r.kgPerUnit, storage:r.storage};
      cur.qty = r2(cur.qty + (num(r.qty)||0));
      if(!cur.kgPerUnit && r.kgPerUnit) cur.kgPerUnit = r.kgPerUnit;
      if(!cur.storage && r.storage) cur.storage = r.storage;
      byUnit.set(u, cur);
    }
    for(const u of byUnit.values()){
      const kg = toKg(u.qty, u.unit, u.kgPerUnit, it);
      if(kg === null) rec.skipped++; else rec.totalKg = r2(rec.totalKg + kg);
      rec.locs.push({location:loc, storage:u.storage||'', qty:u.qty, unit:u.unit,
                     kgPerUnit:u.kgPerUnit, kg:kg, date:v.date});
    }
    if(v.date > rec.lastDate) rec.lastDate = v.date;
  }
  for(const rec of byNo.values()) rec.locs.sort((a,b)=> String(a.location).localeCompare(String(b.location),'th'));
  S._cache.snap = byNo;
  return byNo;
}
const snapOf = no => snapshot().get(String(no)) || null;

function grandTotalKg(){
  if(S._cache.gt != null) return S._cache.gt;
  let kg = 0, skipped = 0;
  for(const rec of snapshot().values()){ kg = r2(kg + rec.totalKg); skipped += rec.skipped; }
  S._cache.gt = {kg, skipped, items: snapshot().size};
  return S._cache.gt;
}
function allDates(){
  if(S._cache.dates) return S._cache.dates;
  const s = new Set(S.entries.map(e=>e.date).filter(Boolean));
  S._cache.dates = [...s].sort((a,b)=> a<b?1:-1);
  return S._cache.dates;
}
function entriesOfDate(d){ return S.entries.filter(e=>e.date===d); }
function usedLocations(){
  const s = new Set(LOCATIONS);
  S.entries.forEach(e=>{ if(e.location) s.add(e.location); });
  return [...s];
}

/* ---- รูปภาพ: ย่อ + หมุนตาม EXIF + จำกัดขนาด ---- */
async function compressImage(file){
  let bmp = null;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    bmp = await new Promise((res,rej)=>{
      const fr = new FileReader();
      fr.onload = ev => { const im = new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('เปิดรูปไม่ได้')); im.src = ev.target.result; };
      fr.onerror = ()=>rej(new Error('อ่านไฟล์ไม่ได้'));
      fr.readAsDataURL(file);
    });
  }
  const tries = [[CFG.PHOTO_EDGE,.62],[520,.55],[440,.48],[360,.42],[300,.36]];
  let out = null;
  for(const [edge,q] of tries){
    let w = bmp.width, h = bmp.height;
    const m = Math.max(w,h);
    if(m > edge){ const k = edge/m; w = Math.round(w*k); h = Math.round(h*k); }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    out = c.toDataURL('image/jpeg', q);
    if(out.length <= CFG.PHOTO_BYTES) return out;
  }
  return out;
}

   หน้า "นับสต็อก" - เลือกสินค้า -> คีย์ตัวเลข -> บันทึก (3 แตะ)

let CQ = {q:'', grp:'all', limit:40};

function recentNos(){ return LS.get('recent', []) || []; }
function pushRecent(no){
  const r = recentNos().filter(x=>x!==no);
  r.unshift(no);
  LS.set('recent', r.slice(0,12));
}
function prefOf(no){
  const p = LS.get('prefs', {}) || {};
  return p[no] || {};
}
function setPref(no, o){
  const p = LS.get('prefs', {}) || {};
  p[no] = Object.assign({}, p[no], o);
  LS.set('prefs', p);
}

function matchItem(it, q){
  if(!q) return true;
  q = q.toLowerCase();
  return it.no.toLowerCase().indexOf(q) >= 0
      || it.desc.toLowerCase().indexOf(q) >= 0
      || it.code.toLowerCase().indexOf(q) >= 0;
}
function filteredItems(){
  return S.items.filter(it =>
    (CQ.grp === 'all' || it.code.indexOf(CQ.grp) === 0) && matchItem(it, CQ.q));
}

function itemRowHtml(it, opts){
  opts = opts || {};
  const snap = snapOf(it.no);
  const today = localDate();
  let right = '<div class="qsub">ยังไม่เคยนับ</div>';
  if(snap){
    const stale = daysBetween(snap.lastDate, today);
    const kgTxt = snap.totalKg > 0 ? fmt(snap.totalKg)+' กก.' : (snap.skipped ? 'ไม่ทราบ กก.' : '0 กก.');
    right = '<div class="qty">'+esc(kgTxt)+'</div>'+
            '<div class="qsub'+(stale > CFG.STALE_DAYS ? ' stale':'')+'">'+
              (stale===0 ? 'นับวันนี้' : stale===1 ? 'เมื่อวาน' : 'นับ '+thDate(snap.lastDate,true))+
            '</div>';
  }
  const img = it.image || it.image2;
  const thumb = img
    ? '<img class="thumb" loading="lazy" decoding="async" src="'+attr(img)+'" alt="">'
    : '<div class="nothumb">📦</div>';
  return '<button class="itemrow" data-act="'+(opts.act||'countOpen')+'" data-no="'+attr(it.no)+'">'+
    thumb+

      '<div class="t1">'+esc(it.desc || it.no)+'</div>'+
      '<div class="t2">'+badge(it.code)+'<span class="mono">'+esc(it.no)+'</span>'+
      (it.col2 ? '<span>'+esc(it.col2)+' กก./หน่วย</span>' : '')+'</div>'+
    '</div>'+
    '<div class="right">'+right+'</div>'+

  const shown = list.slice(0, CQ.limit);

  '<div class="page-title">นับสต็อก</div>'+

    (CQ.q?'<button class="sx" data-act="cclear">✕</button>':'')+
  '</div>'+
  '<div class="chips scroll" style="margin-bottom:12px">'+grpChips+'</div>'+
  (recents.length
    ? '<div class="page-sub" style="margin-bottom:6px">นับล่าสุด</div>'+
      recents.map(it=>itemRowHtml(it)).join('')+
      '<div class="page-sub" style="margin:14px 0 6px">ทั้งหมด ('+list.length+')</div>'
    : '')+
  (rows || emptyBox('🔍','ไม่พบสินค้า','ลองค้นหาด้วยคำอื่น หรือเพิ่มรายการใหม่ในทะเบียนวัตถุดิบ'))+

    ? '<div class="card" style="margin-top:16px">'+

let CS = null;

function countOpen(no, eid){
  const it = itemOf(no);
  if(!it){ toast('ไม่พบสินค้า','err'); return; }
  const today = localDate();
  const pref = prefOf(no);
  const existing = eid ? S.byEid.get(eid) : null;

  CS = existing ? {
    item:it, qty:String(existing.qty), unit:existing.unit,
    location:existing.location, kgPerUnit:existing.kgPerUnit||'',
    storage:existing.storage||'', note:existing.note||'',
    photos:(existing.photos||[]).slice(), eid:existing.eid, date:existing.date, extra:true
  } : {
    item:it, qty:'', unit: pref.unit || guessUnit(it),
    location: pref.location || LS.get('lastLoc', LOCATIONS[0]),
    kgPerUnit: pref.kgPerUnit || (it.col2||''),
    storage: pref.storage || it.storage || '', note:'', photos:[],
    eid:null, date:today, extra:false, asNew:false
  };
  openSheet({
    title: it.desc || it.no,
    sub: it.no + '  ·  ' + (CODE_MAP[it.code]||it.code),
    body: countBody(),
    foot: '<button class="btn btn-ghost" data-act="sheetClose">ยกเลิก</button>'+
          '<button class="btn btn-primary" data-act="countSave" style="flex:2">บันทึก</button>',
    onAct: COUNT_ACTS,
    after: bindPhotoInput
  });
}
function guessUnit(it){
  if(it.pkg === 'bag')  return 'กระสอบ';
  if(it.pkg === 'drum') return 'ถัง';
  if(it.pkg === 'bulk') return 'เบาท์';
  return 'กก.';
}
function sameDayEntry(){
  if(!CS || CS.eid) return null;
  return S.entries.find(e => e.no===CS.item.no && e.date===CS.date &&
                             e.location===CS.location && !CS.asNew) || null;
}

function countBody(){
  const it = CS.item;
  const kg = toKg(num(CS.qty)||0, CS.unit, CS.kgPerUnit, it);
  const wpu = wpuOf(CS.unit, CS.kgPerUnit, it);

    '<button class="chip'+(CS.location===l?' on':'')+'" data-act="cloc" data-v="'+attr(l)+'">'+esc(l)+'</button>').join('');
  const unitChips = UNITS.map(u =>

  (dup ? '<div class="note" style="margin-bottom:12px">วันนี้นับ '+esc(CS.location)+' ไว้แล้ว '+fmt(dup.qty)+' '+esc(dup.unit)+

         '<button class="btn btn-ghost btn-sm" style="margin-left:6px" data-act="casnew">เพิ่มเป็นอีกกอง</button></div>' : '')+
  '<div class="qtybox">'+
    '<div><div class="val'+(CS.qty?'':' ph')+'" id="cVal">'+esc(CS.qty||'0')+'</div></div>'+
    '<div style="text-align:right">'+
      '<div class="unit">'+esc(CS.unit||'เลือกหน่วย')+'</div>'+
      '<div class="kg'+(kg===null?' warn':'')+'" id="cKg">'+
        (kg===null ? 'ยังแปลงเป็น กก. ไม่ได้' : '= '+fmt(kg)+' กก.')+'</div>'+
    '</div>'+
  '</div>'+
  '<div class="numpad" style="margin-bottom:16px">'+pad+'</div>'+
  '<div class="fld"><label>สถานที่ (Location)</label><div class="chips">'+locChips+'</div></div>'+

    ? '<div class="fld"><label>น้ำหนักต่อ 1 '+esc(CS.unit||'หน่วย')+' (กก.)</label>'+

    : '')+

    '<div class="fld"><label>รูปหลักฐาน (สูงสุด '+CFG.MAX_PHOTOS+')</label>'+
      '<div class="photos">'+photos+
      (CS.photos.length < CFG.MAX_PHOTOS
        ? '<label class="addph"><span class="ic">📷</span><span>ถ่ายรูป</span>'+
          '<input type="file" accept="image/*" capture="environment" hidden id="cPhoto"></label>' : '')+
      '</div></div>'+
  '</details>';
}

function refreshCountBody(){
  const b = $('sheetBody');
  if(!b) return;
  const sc = b.scrollTop;
  b.innerHTML = countBody();
  b.scrollTop = sc;
  bindPhotoInput();
}
function updateQtyDisplay(){
  const v = $('cVal'), k = $('cKg');
  if(!v) return;
  v.textContent = CS.qty || '0';
  v.classList.toggle('ph', !CS.qty);
  const kg = toKg(num(CS.qty)||0, CS.unit, CS.kgPerUnit, CS.item);
  k.textContent = kg===null ? 'ยังแปลงเป็น กก. ไม่ได้' : '= '+fmt(kg)+' กก.';
  k.classList.toggle('warn', kg===null);
}
function bindPhotoInput(){
  const inp = $('cPhoto');
  if(!inp) return;
  inp.onchange = async () => {
    const files = [...(inp.files||[])].slice(0, CFG.MAX_PHOTOS - CS.photos.length);
    if(!files.length) return;
    busy(true,'กำลังย่อรูป...');
    for(const f of files){
      try{ const b64 = await compressImage(f); if(b64) CS.photos.push(b64); }
      catch(e){ toast('รูปนี้ใช้ไม่ได้: '+e.message,'err'); }
    }
    busy(false);
    refreshCountBody();
  };
  const st = $('cStorage'); if(st) st.oninput = e => CS.storage = e.target.value;
  const nt = $('cNote');    if(nt) nt.oninput = e => CS.note = e.target.value;
  const wp = $('cWpu');     if(wp) wp.oninput = e => { CS.kgPerUnit = e.target.value; updateQtyDisplay(); };
}

const COUNT_ACTS = {
  ckey: el => {
    const k = el.dataset.k;
    if(k === '⌫'){ CS.qty = CS.qty.slice(0,-1); }
    else if(k === '.'){ if(CS.qty.indexOf('.') < 0) CS.qty = (CS.qty||'0') + '.'; }
    else { if(CS.qty === '0') CS.qty = k; else if(CS.qty.length < 10) CS.qty += k; }
    updateQtyDisplay();
  },
  cloc: el => { CS.location = el.dataset.v; refreshCountBody(); },
  cunit: el => {
    CS.unit = el.dataset.v;
    const u = UNIT_MAP[CS.unit];
    if(u && u.fixed) CS.kgPerUnit = '';
    else if(u && u.kg && !CS.kgPerUnit) CS.kgPerUnit = String(u.kg);
    else if(!CS.kgPerUnit && CS.item.col2) CS.kgPerUnit = CS.item.col2;
    refreshCountBody();
  },
  casnew: () => { CS.asNew = true; refreshCountBody(); },
  cphdel: el => { CS.photos.splice(+el.dataset.i,1); refreshCountBody(); },
  countSave: () => saveCount()
};

function saveCount(){
  const q = num(CS.qty);
  if(!CS.qty || !isFinite(q) || q < 0){ toast('กรุณากรอกจำนวน','err'); return; }
  if(q > 9999999){ toast('จำนวนดูผิดปกติ กรุณาตรวจสอบ','err'); return; }
  if(!CS.unit){ toast('กรุณาเลือกหน่วย','err'); return; }
  if(!CS.location){ toast('กรุณาเลือกสถานที่','err'); return; }

  const it = CS.item;
  let e = CS.eid ? S.byEid.get(CS.eid) : sameDayEntry();
  if(!e){
    e = {eid: uid(), date: CS.date, no: it.no, code: it.code, desc: it.desc,
         location: CS.location, storage:'', qty:0, unit:'', kgPerUnit:'', note:'', photos:[], by:S.user, ts:0};
    S.entries.unshift(e);
    S.byEid.set(e.eid, e);
  }
  e.qty       = r2(q);
  e.unit      = CS.unit;
  e.kgPerUnit = (UNIT_MAP[CS.unit] && UNIT_MAP[CS.unit].fixed) ? '' : String(CS.kgPerUnit||'');
  e.location  = CS.location;
  e.storage   = CS.storage||'';
  e.note      = CS.note||'';
  e.photos    = CS.photos.slice();
  e.desc      = it.desc; e.code = it.code;
  e.by        = S.user;
  e.ts        = Date.now();

  setPref(it.no, {location:CS.location, unit:CS.unit, kgPerUnit:e.kgPerUnit, storage:e.storage});
  LS.set('lastLoc', CS.location);
  pushRecent(it.no);
  bump();
  markDirty(e.eid);
  closeSheet(true);
  const kg = toKg(e.qty, e.unit, e.kgPerUnit, it);
  toast('บันทึก ' + (it.desc||it.no) + ' ' + fmt(e.qty) + ' ' + e.unit + (kg!==null ? ' ('+fmt(kg)+' กก.)' : ''));
  render();
}

let SQ = {q:'', grp:'all', loc:'all'};

function viewStock(){
  const snap = snapshot();
  const gt = grandTotalKg();
  const today = localDate();

  let rows = S.items.filter(it => snap.has(it.no));
  if(SQ.grp !== 'all') rows = rows.filter(it => it.code.indexOf(SQ.grp)===0);
  if(SQ.q) rows = rows.filter(it => matchItem(it, SQ.q));
  if(SQ.loc !== 'all') rows = rows.filter(it => snap.get(it.no).locs.some(l=>l.location===SQ.loc));

  const locs = ['all'].concat([...new Set([].concat(...[...snap.values()].map(r=>r.locs.map(l=>l.location))))].sort());

    '<button class="chip'+(SQ.loc===l?' on':'')+'" data-act="sloc" data-v="'+attr(l)+'">'+esc(l==='all'?'ทุกสถานที่':l)+'</button>').join('');
  const grpChips = [['all','ทั้งหมด'],['A','A'],['B','B'],['C','C']]
    .map(g=>'<button class="chip'+(SQ.grp===g[0]?' on':'')+'" data-act="sgrp" data-g="'+g[0]+'">'+esc(g[1])+'</button>').join('');

  const cards = rows.map(it => {
    const rec = snap.get(it.no);
    const ls = SQ.loc==='all' ? rec.locs : rec.locs.filter(l=>l.location===SQ.loc);
    const kg = ls.reduce((a,l)=> l.kg===null?a:r2(a+l.kg), 0);
    const unknown = ls.some(l=>l.kg===null);
    const stale = daysBetween(rec.lastDate, today);
    return '<div class="card flat" style="margin-bottom:9px">'+
      '<div class="sec-head">'+
        '<div style="min-width:0"><div class="sh1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          badge(it.code)+' '+esc(it.desc||it.no)+'</div>'+
        '<div class="sh2 mono">'+esc(it.no)+' · นับ '+thDate(rec.lastDate,true)+
          (stale>CFG.STALE_DAYS?' <span class="stale">(เก่า '+stale+' วัน)</span>':'')+'</div></div>'+
        '<span class="pill">'+(kg>0?fmt(kg)+' กก.':'—')+(unknown?' +?':'')+'</span>'+
      '</div>'+
      ls.map(l =>
        '<div class="lrow">'+
          '<div><div class="l1">📍 '+esc(l.location)+'</div>'+
          (l.storage?'<div class="l2">'+esc(l.storage)+'</div>':'')+'</div>'+
          '<div style="text-align:right">'+
            '<div class="rv">'+fmt(l.qty)+' '+esc(l.unit)+'</div>'+

/* ==================================================================
   หน้า "ประวัติการนับ"
   ================================================================== */
let HQ = {date:null, loc:'all', mode:'day', q:''};

function viewHistory(){
  const dates = allDates();
  if(!dates.length) return '<div class="page-title">ประวัติการนับ</div>'+
    emptyBox('📅','ยังไม่มีประวัติ','เมื่อเริ่มบันทึกการนับสต็อก รายการจะมาแสดงที่นี่');
  if(!HQ.date || dates.indexOf(HQ.date) < 0) HQ.date = dates[0];

  if(HQ.q) return historyHead(dates) + historySearch();
  if(HQ.mode === 'month') return historyHead(dates) + historyMonths();

  let rows = entriesOfDate(HQ.date);
  const locs = ['all'].concat([...new Set(rows.map(e=>e.location||'ไม่ระบุ'))]);
  if(HQ.loc !== 'all') rows = rows.filter(e => (e.location||'ไม่ระบุ') === HQ.loc);
  rows = rows.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));

  const tot = sumKg(rows);
  const byLoc = {};
  rows.forEach(e=>{
    const l = e.location||'ไม่ระบุ';
    const k = toKg(e.qty, e.unit, e.kgPerUnit, itemOf(e.no));
    if(!byLoc[l]) byLoc[l] = 0;
    if(k!==null) byLoc[l] = r2(byLoc[l]+k);
  });

  const locChips = locs.map(l =>
    '<button class="chip'+(HQ.loc===l?' on':'')+'" data-act="hloc" data-v="'+attr(l)+'">'+
    esc(l==='all'?'ทั้งหมด':l)+'<span class="cnt">'+
    (l==='all'?entriesOfDate(HQ.date).length:entriesOfDate(HQ.date).filter(e=>(e.location||'ไม่ระบุ')===l).length)+
    '</span></button>').join('');

  const cards = rows.map(e=>{
    const it = itemOf(e.no);
    const kg = toKg(e.qty, e.unit, e.kgPerUnit, it);
    const w  = wpuOf(e.unit, e.kgPerUnit, it);
    const ph = (e.photos||[]).map(p=>'<div class="ph"><img src="'+attr(p)+'" data-act="lb" data-v="'+attr(p)+'" alt=""></div>').join('');
    return '<div class="card" style="margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'+
        '<div style="min-width:0"><div class="l1" style="font-size:14px">'+badge(e.code)+' '+esc(e.desc||e.no)+'</div>'+
        '<div class="l2 mono">'+esc(e.no)+'</div></div>'+
        '<div style="text-align:right;flex-shrink:0"><div class="rv" style="font-size:15px">'+fmt(e.qty)+' '+esc(e.unit)+'</div>'+
        '<div class="l2">'+(kg===null?'<span class="stale">ไม่ทราบ กก.</span>':fmt(kg)+' กก.')+'</div></div>'+
      '</div>'+
      '<div class="l2" style="margin-top:7px;display:flex;gap:10px;flex-wrap:wrap">'+
        '<span>📍 '+esc(e.location||'-')+'</span>'+
        (e.storage?'<span>'+esc(e.storage)+'</span>':'')+
        (w?'<span>'+fmt(w)+' กก./'+esc(e.unit)+'</span>':'')+
        (e.by?'<span>👤 '+esc(e.by)+'</span>':'')+
      '</div>'+
      (e.note?'<div class="l2" style="margin-top:4px">📝 '+esc(e.note)+'</div>':'')+
      (ph?'<div class="photos" style="margin-top:8px">'+ph+'</div>':'')+
      '<div class="btn-row" style="margin-top:10px">'+
        '<button class="btn btn-ghost btn-sm" data-act="hedit" data-eid="'+attr(e.eid)+'">✏️ แก้ไข</button>'+
        '<button class="btn btn-ghost btn-sm" data-act="hdel" data-eid="'+attr(e.eid)+'" style="color:var(--red)">🗑 ลบ</button>'+
      '</div>'+
    '</div>';
  }).join('');

  return historyHead(dates)+
    '<div class="chips scroll" style="margin-bottom:12px">'+locChips+'</div>'+
    '<div class="card flat" style="margin-bottom:12px">'+
      '<div class="sec-head"><div class="sh1">สรุปรวมวันนี้</div><div class="sh2">'+rows.length+' แถว</div></div>'+
      Object.keys(byLoc).map(l=>'<div class="lrow"><div class="l1">📦 '+esc(l)+'</div><div class="rv">'+fmt(byLoc[l])+' กก.</div></div>').join('')+
      '<div class="lrow" style="background:var(--tint)"><div class="l1" style="color:var(--navy)">รวมทั้งหมด</div>'+
      '<div class="rv" style="font-size:15px">'+fmt(tot.kg)+' กก.</div></div>'+
      (tot.skipped?'<div style="padding:8px 13px;font-size:11.5px;color:var(--amber)">⚠️ '+tot.skipped+' แถวยังไม่มีน้ำหนักต่อหน่วย จึงไม่ถูกรวม — กดแก้ไขแถวนั้นเพื่อกรอก</div>':'')+
    '</div>'+
    (cards || emptyBox('📋','ไม่มีรายการ','ลองเลือกสถานที่อื่น'));
}

function historyHead(dates){
  const i = dates.indexOf(HQ.date);
  return ''+
  '<div class="page-title">ประวัติการนับ</div>'+
  '<div class="page-sub">'+dates.length+' วันที่มีการบันทึก</div>'+
  '<div class="searchbar">'+
    '<span class="si">🔍</span>'+
    '<input id="hSearch" type="search" placeholder="ค้นหาสินค้าในประวัติทั้งหมด" value="'+attr(HQ.q)+'" autocomplete="off">'+
    (HQ.q?'<button class="sx" data-act="hclear">✕</button>':'')+
  '</div>'+
  (HQ.q ? '' :
  '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">'+
    '<div class="chips">'+
      '<button class="chip'+(HQ.mode==='day'?' on':'')+'" data-act="hmode" data-v="day">รายวัน</button>'+
      '<button class="chip'+(HQ.mode==='month'?' on':'')+'" data-act="hmode" data-v="month">รายเดือน</button>'+
    '</div>'+
    (HQ.mode==='day'
      ? '<div style="display:flex;gap:6px;align-items:center;margin-left:auto">'+
        '<button class="btn btn-ghost btn-sm" data-act="hprev"'+(i>=dates.length-1?' disabled':'')+'>‹</button>'+
        '<select id="hDate" class="btn btn-ghost btn-sm" style="min-width:150px">'+
          dates.map(d=>'<option value="'+attr(d)+'"'+(d===HQ.date?' selected':'')+'>'+esc(thDate(d))+'</option>').join('')+
        '</select>'+
        '<button class="btn btn-ghost btn-sm" data-act="hnext"'+(i<=0?' disabled':'')+'>›</button>'+
      '</div>' : '')+
  '</div>');
}
function historyMonths(){
  const m = {};
  S.entries.forEach(e=>{
    const ym = e.date.slice(0,7);
    if(!m[ym]) m[ym] = {days:new Set(), n:0, kg:0, skip:0};
    m[ym].days.add(e.date); m[ym].n++;
    const k = toKg(e.qty,e.unit,e.kgPerUnit,itemOf(e.no));
    if(k===null) m[ym].skip++; else m[ym].kg = r2(m[ym].kg+k);
  });
  const keys = Object.keys(m).sort().reverse();
  return keys.map(ym=>
    '<button class="itemrow" data-act="hmonth" data-v="'+attr(ym)+'">'+
      '<div class="nothumb">📅</div>'+
      '<div class="body"><div class="t1">'+esc(thMonth(ym))+'</div>'+
      '<div class="t2">'+m[ym].days.size+' วัน · '+m[ym].n+' แถว</div></div>'+
      '<div class="right"><div class="qty">'+fmt(m[ym].kg)+' กก.</div>'+
      (m[ym].skip?'<div class="qsub stale">'+m[ym].skip+' แถวไม่ทราบ</div>':'')+'</div>'+
    '</button>').join('') || emptyBox('📅','ไม่มีข้อมูล');
}
function historySearch(){
  const q = HQ.q.toLowerCase();
  const hits = S.entries.filter(e =>
    e.no.toLowerCase().indexOf(q)>=0 || (e.desc||'').toLowerCase().indexOf(q)>=0);
  if(!hits.length) return emptyBox('🔍','ไม่พบ "'+HQ.q+'"','ลองค้นหาด้วยรหัส No. หรือชื่อสินค้า');
  const byDate = {};
  hits.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  return '<div class="page-sub">พบ '+hits.length+' แถว ใน '+Object.keys(byDate).length+' วัน</div>'+
    Object.keys(byDate).sort().reverse().map(d=>
      '<div class="card flat" style="margin-bottom:9px">'+
        '<div class="sec-head"><div class="sh1">'+esc(thDate(d))+'</div></div>'+
        byDate[d].map(e=>{
          const kg = toKg(e.qty,e.unit,e.kgPerUnit,itemOf(e.no));
          return '<div class="lrow"><div style="min-width:0">'+
            '<div class="l1">'+esc(e.desc||e.no)+'</div>'+
            '<div class="l2">📍 '+esc(e.location||'-')+'</div></div>'+
            '<div style="text-align:right"><div class="rv">'+fmt(e.qty)+' '+esc(e.unit)+'</div>'+
            '<div class="l2">'+(kg===null?'-':fmt(kg)+' กก.')+'</div></div></div>';
        }).join('')+
      '</div>').join('');
}

async function deleteEntry(eid){
  const e = S.byEid.get(eid);
  if(!e) return;
  const ok = await confirmBox('ลบรายการนี้?\n'+(e.desc||e.no)+' — '+fmt(e.qty)+' '+e.unit+'\n('+esc(e.location)+')', 'ลบ');
  if(!ok) return;
  const date = e.date;
  S.entries = S.entries.filter(x => x.eid !== eid);
  S.byEid.delete(eid);
  bump();
  markRemoved(eid, date);
  toast('ลบแล้ว');
  render();
}

/* ==================================================================
   ทะเบียนวัตถุดิบ (master data)
   ================================================================== */
let IQ = {q:'', grp:'all', page:1, sort:'no', dir:'asc'};

function viewItems(){
  let rows = S.items.filter(it => (IQ.grp==='all' || it.code.indexOf(IQ.grp)===0) && matchItem(it, IQ.q));
  rows = rows.slice().sort((a,b)=>{
    let va = String(a[IQ.sort]||''), vb = String(b[IQ.sort]||'');
    if(IQ.sort==='no'){ va = va.padStart(12,'0'); vb = vb.padStart(12,'0'); }
    const r = va.localeCompare(vb,'th');
    return IQ.dir==='asc' ? r : -r;
  });
  const pages = Math.max(1, Math.ceil(rows.length/CFG.PAGE));
  if(IQ.page > pages) IQ.page = 1;
  const slice = rows.slice((IQ.page-1)*CFG.PAGE, IQ.page*CFG.PAGE);

  const grpChips = [['all','ทั้งหมด ('+S.items.length+')']]
    .concat(Object.keys(CODE_MAP).map(c=>{
      const n = S.items.filter(i=>i.code===c).length;
      return n ? [c, c+' ('+n+')'] : null;
    }).filter(Boolean))
    .map(g=>'<button class="chip'+(IQ.grp===g[0]?' on':'')+'" data-act="igrp" data-g="'+g[0]+'">'+esc(g[1])+'</button>').join('');

  const list = slice.map(it => itemRowHtml(it, {act:'itemDetail'})).join('');

  const pager = pages > 1
    ? '<div class="pager">'+
      '<button data-act="ipage" data-v="'+(IQ.page-1)+'"'+(IQ.page<=1?' disabled':'')+'>‹</button>'+
      '<button class="on">'+IQ.page+' / '+pages+'</button>'+
      '<button data-act="ipage" data-v="'+(IQ.page+1)+'"'+(IQ.page>=pages?' disabled':'')+'>›</button>'+
      '</div>' : '';

  return ''+
  '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px">'+
    '<div class="page-title">ทะเบียนวัตถุดิบ</div>'+
    '<button class="btn btn-primary btn-sm" data-act="itemNew">+ เพิ่ม</button>'+
  '</div>'+
  '<div class="page-sub">'+rows.length+' รายการ</div>'+
  '<div class="searchbar"><span class="si">🔍</span>'+
    '<input id="iSearch" type="search" placeholder="ค้นหาชื่อ / No. / Code" value="'+attr(IQ.q)+'" autocomplete="off">'+
    (IQ.q?'<button class="sx" data-act="iclear">✕</button>':'')+
  '</div>'+
  '<div class="chips scroll" style="margin-bottom:12px">'+grpChips+'</div>'+
  (list || emptyBox('📋','ไม่พบรายการ','ลองเปลี่ยนคำค้นหา หรือกด "+ เพิ่ม"'))+
  pager;
}

          '<div class="l2">'+esc(e.by||'-')+'</div></div>'+
          '<div class="rv">'+fmt(e.qty)+' '+esc(e.unit)+'</div></div>').join('')+

         '<button class="btn btn-primary" data-act="countOpen" data-no="'+attr(it.no)+'">นับสต็อก</button>'
  });

function kv(k,v){

/* ---- ฟอร์มเพิ่ม/แก้ไขวัตถุดิบ ---- */

}

async function saveItem(){
  if(!IF.code){ toast('กรุณาเลือก Code','err'); return; }
  const no = String(IF.no||'').trim();
  if(!no){ toast('กรุณากรอกรหัส No.','err'); return; }
  if(!IF.desc.trim()){ toast('กรุณากรอกชื่อสินค้า','err'); return; }
  const clash = S.items.find(x => x.no === no);
  if(IF.isNew && clash){ toast('รหัส '+no+' มีอยู่แล้ว ('+clash.desc+')','err'); return; }

  const rec = {
    row: IF.row||0, code:IF.code, no:normNo(no), desc:IF.desc.trim(),
    pkg:IF.pkg||'', col2:IF.col2||'', cond:IF.cond||'',
    loc:IF.loc||'', storage:IF.storage||'', notes:IF.notes||'',
    image:IF.image||'', image2:IF.image2||''
  };
  busy(true,'กำลังบันทึก...');
  try{
    const payload = {
      action:'saveItem',
      'Code':rec.code, 'No.':rec.no, 'Description':rec.desc,
      'pic':rec.image, 'pic2':rec.image2,
      'บรรจุ':rec.pkg, 'นน./หน่วย':rec.col2, 'เงื่อนไขการซื้อขาย':rec.cond,
      'สถานที่จัดเก็บ':rec.storage, 'หมายเหตุ':rec.notes
    };
    /* ไม่ส่งฟิลด์ location ถ้าไม่มีในฟอร์ม -> ไม่ไปล้างค่าเดิมบนชีต */
    if(rec.loc) payload.location = rec.loc;
    if(rec.row) payload._row = rec.row;
    await req(null, payload);
    if(IF.isNew) S.items.push(rec);
    else {
      const i = S.items.findIndex(x=>x.no === (IF._origNo||no));
      if(i>=0) S.items[i] = rec; else S.items.push(rec);
    }
    LS.set('items', S.items);
    reindex();
    closeSheet(true);
    toast('บันทึก '+rec.no+' เรียบร้อย');
    render();
  }catch(e){
    toast('บันทึกไม่สำเร็จ: '+e.message,'err');
  }finally{ busy(false); }
}
async function deleteItemAsk(no){
  const it = itemOf(no); if(!it) return;
  const n = S.entries.filter(e=>e.no===no).length;
  const ok = await confirmBox('ลบ "'+(it.desc||no)+'" ออกจากทะเบียน?'+
    (n?'\n\nมีประวัติการนับ '+n+' แถว ประวัติจะยังอยู่แต่จะไม่แสดงชื่อสินค้า':''), 'ลบ');
  if(!ok) return;
  busy(true,'กำลังลบ...');
  try{
    await req(null, {action:'deleteItem', 'No.':no});
    S.items = S.items.filter(x=>x.no!==no);
    LS.set('items', S.items); reindex();
    toast('ลบแล้ว'); render();
  }catch(e){ toast('ลบไม่สำเร็จ: '+e.message,'err'); }
  finally{ busy(false); }
}

    onAct:{

function readExp(){
  const g = id => { const e = $(id); return e ? e.value : null; };
  EX.from = g('exFrom') || EX.from; EX.to = g('exTo') || EX.to;
  EX.grp  = g('exGrp')  || EX.grp;  EX.loc = g('exLoc') || EX.loc;
}
function expRows(){
  const okGrp = c => EX.grp==='all' || (EX.grp.length===1 ? String(c).indexOf(EX.grp)===0 : c===EX.grp);
  if(EX.type==='stock'){
    const out = [];
    for(const it of S.items){
      const rec = snapOf(it.no); if(!rec || !okGrp(it.code)) continue;
      rec.locs.forEach(l=>{
        if(EX.loc!=='all' && l.location!==EX.loc) return;
        out.push({date:l.date, no:it.no, desc:it.desc, code:it.code, location:l.location,
                  storage:l.storage, qty:l.qty, unit:l.unit, kg:l.kg, by:''});
      });
    }
    return out.sort((a,b)=> a.code===b.code ? a.no.localeCompare(b.no) : a.code.localeCompare(b.code));
  }
  const lo = EX.from < EX.to ? EX.from : EX.to;
  const hi = EX.from < EX.to ? EX.to : EX.from;
  return S.entries.filter(e => e.date>=lo && e.date<=hi && okGrp(e.code) &&
      (EX.loc==='all' || e.location===EX.loc))
    .map(e=>({date:e.date, no:e.no, desc:e.desc, code:e.code, location:e.location,
              storage:e.storage, qty:e.qty, unit:e.unit,
              kg: toKg(e.qty,e.unit,e.kgPerUnit,itemOf(e.no)), by:e.by, note:e.note}))
    .sort((a,b)=> a.date===b.date ? a.no.localeCompare(b.no) : (a.date<b.date?-1:1));
}
/* กัน CSV injection: ค่าที่ขึ้นต้นด้วย = + - @ จะถูกทำให้เป็นข้อความ */
function csvCell(v){
  let s = v==null ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g,'""') + '"';
}
function runExport(kind){
  const rows = expRows();
  if(!rows.length){ toast('ไม่พบข้อมูลตามเงื่อนไข','err'); return; }
  const label = EX.type==='stock' ? 'สต็อกคงเหลือ ณ '+thDate(localDate())
              : 'ประวัติการนับ '+thDate(EX.from)+' – '+thDate(EX.to);
  if(kind==='csv'){
    const head = ['วันที่นับ','รหัส No.','ชื่อสินค้า','Code','สถานที่','จุดจัดเก็บ','จำนวน','หน่วย','รวม (กก.)','ผู้บันทึก','หมายเหตุ'];
    const body = rows.map(r=>[thDate(r.date), r.no, r.desc, r.code, r.location, r.storage,
                              r.qty, r.unit, r.kg==null?'':r.kg, r.by||'', r.note||'']);
    const csv = [head].concat(body).map(r=>r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'SPM_'+EX.type+'_'+localDate()+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    closeSheet(true);
    toast('ดาวน์โหลด CSV แล้ว ('+rows.length+' แถว)');
    return;
  }
  /* พิมพ์ */
  let kg = 0, skip = 0;
  rows.forEach(r=>{ if(r.kg==null) skip++; else kg = r2(kg+r.kg); });
  const byLoc = {};
  rows.forEach(r=>{ const l=r.location||'-'; if(!byLoc[l]) byLoc[l]=0; if(r.kg!=null) byLoc[l]=r2(byLoc[l]+r.kg); });

      '<div style="font-size:10px;color:#888;text-align:right">พิมพ์ '+esc(thDate(localDate()))+'<br>โดย '+esc(S.user||'-')+'</div>'+
    '</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:11px">'+
      '<thead><tr style="background:#d6eaf8">'+
        ['วันที่','No.','ชื่อสินค้า','สถานที่','จำนวน','หน่วย','รวม (กก.)'].map(h=>
          '<th style="border:1px solid #bbb;padding:5px 7px;text-align:left">'+esc(h)+'</th>').join('')+
      '</tr></thead><tbody>'+
      rows.map(r=>'<tr>'+
        '<td style="border:1px solid #ddd;padding:4px 7px">'+esc(thDate(r.date,true))+'</td>'+
        '<td style="border:1px solid #ddd;padding:4px 7px">'+esc(r.no)+'</td>'+
        '<td style="border:1px solid #ddd;padding:4px 7px">'+esc(r.desc)+'</td>'+
        '<td style="border:1px solid #ddd;padding:4px 7px">'+esc(r.location)+'</td>'+

      '</tr>').join('')+
      '</tbody></table>'+
    '<div style="margin-top:14px;border-top:2px solid #1a5276;padding-top:8px">'+
      Object.keys(byLoc).map(l=>'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0">'+
        '<span>'+esc(l)+'</span><b>'+fmt(byLoc[l])+' กก.</b></div>').join('')+
      '<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid #ccc;margin-top:4px">'+
        '<b>รวมทั้งหมด ('+rows.length+' แถว)</b><b>'+fmt(kg)+' กก.</b></div>'+
      (skip?'<div style="font-size:10px;color:#8a5a00">* '+skip+' แถวไม่ทราบน้ำหนักต่อหน่วย จึงไม่ถูกรวม</div>':'')+
    '</div>'+
    '<div style="margin-top:26px;display:flex;gap:36px;font-size:10px;color:#666">'+
      '<div style="flex:1">ผู้จัดทำ: _______________________</div>'+
      '<div style="flex:1">ผู้ตรวจสอบ: _______________________</div>'+
      '<div style="flex:1">วันที่: _______________________</div>'+

  setTimeout(()=>{ window.print(); }, 120);
}

/* ---- เปรียบเทียบ 2 วันที่นับ ---- */
function varOpen(){
  const dates = allDates();
  if(dates.length < 2){ toast('ต้องมีการนับอย่างน้อย 2 วัน','err'); return; }
  const d2 = dates[0], d1 = dates[1];
  const opt = (sel)=>dates.map(d=>'<option value="'+attr(d)+'"'+(d===sel?' selected':'')+'>'+esc(thDate(d))+'</option>').join('');
  openSheet({
    title:'เปรียบเทียบยอดนับ 2 วัน',
    body:'<div class="grid2">'+
      '<div class="fld"><label>วันก่อนหน้า</label><select id="vA">'+opt(d1)+'</select></div>'+
      '<div class="fld"><label>วันหลัง</label><select id="vB">'+opt(d2)+'</select></div></div>'+
      '<div id="vOut"></div>',
    foot:'<button class="btn btn-ghost" data-act="sheetClose">ปิด</button>'+
         '<button class="btn btn-primary" data-act="varRun">เปรียบเทียบ</button>',
    onAct:{ varRun: varRun },
    after: varRun
  });
}
function varRun(){
  const a = $('vA').value, b = $('vB').value;
  const out = $('vOut');
  if(a === b){ out.innerHTML = '<div class="note">กรุณาเลือกวันที่ต่างกัน</div>'; return; }
  const sum = d => {
    const m = {};
    entriesOfDate(d).forEach(e=>{
      const k = toKg(e.qty,e.unit,e.kgPerUnit,itemOf(e.no));
      if(!m[e.no]) m[e.no] = {no:e.no, desc:e.desc, kg:0, unknown:false};
      if(k===null) m[e.no].unknown = true; else m[e.no].kg = r2(m[e.no].kg+k);
    });
    return m;
  };
  const A = sum(a), B = sum(b);
  const nos = [...new Set(Object.keys(A).concat(Object.keys(B)))];
  let up=0, dn=0, same=0, tot=0;
  const rows = nos.map(no=>{
    const ka = A[no]?A[no].kg:0, kb = B[no]?B[no].kg:0;
    const df = r2(kb-ka); tot = r2(tot+df);
    if(df>0) up++; else if(df<0) dn++; else same++;
    const c = df>0?'var(--green)':df<0?'var(--red)':'var(--ink3)';
    return {no, df, html:'<div class="lrow"><div style="min-width:0">'+
      '<div class="l1">'+esc((A[no]||B[no]).desc||no)+'</div>'+
      '<div class="l2 mono">'+fmt(ka)+' → '+fmt(kb)+' กก.</div></div>'+
      '<div class="rv" style="color:'+c+'">'+(df>0?'▲ +':df<0?'▼ ':'– ')+fmt(df)+'</div></div>'};
  }).sort((x,y)=>Math.abs(y.df)-Math.abs(x.df));
  out.innerHTML =
    '<div class="kpis" style="margin:10px 0"><div class="kpi b3"><div class="n">'+up+'</div><div class="l">เพิ่มขึ้น</div></div>'+
    '<div class="kpi" style="background:var(--red)"><div class="n">'+dn+'</div><div class="l">ลดลง</div></div>'+
    '<div class="kpi b2"><div class="n">'+(tot>=0?'+':'')+fmt(tot/1000,1)+'K</div><div class="l">ส่วนต่าง (ตัน)</div></div></div>'+
    '<div class="card flat">'+rows.map(r=>r.html).join('')+'</div>'+
    '<div class="note info" style="margin-top:10px">เทียบจากยอดที่ "นับได้จริง" ในสองวันนั้น หากวันใดไม่ได้นับสินค้าตัวนั้น จะถือเป็น 0</div>';
}

/* ==================================================================
   ACTIONS (ทุกปุ่มผ่าน data-act ไม่มี inline onclick = ไม่มีช่อง XSS)
   ================================================================== */
const ACT = {
  go: el => go(el.dataset.p),
  back: () => history.back(),
  menu: () => go('more'),
  sheetClose: () => closeSheet(),
  lb: el => lightbox(el.dataset.v),
  lbClose: () => $('lightbox').classList.remove('open'),

  /* count */
  countOpen: el => { closeSheet(true); setTimeout(()=>countOpen(el.dataset.no), 60); },
  cgrp: el => { CQ.grp = el.dataset.g; CQ.limit = 40; render(); },
  cclear: () => { CQ.q=''; render(); },
  cmore: () => { CQ.limit += 60; render(); },

  /* stock */
  sgrp: el => { SQ.grp = el.dataset.g; render(); },
  sloc: el => { SQ.loc = el.dataset.v; render(); },
  sclear: () => { SQ.q=''; render(); },

  /* history */
  hloc:  el => { HQ.loc = el.dataset.v; render(); },
  hmode: el => { HQ.mode = el.dataset.v; render(); },
  hprev: () => { const d = allDates(); const i = d.indexOf(HQ.date); if(i < d.length-1){ HQ.date = d[i+1]; HQ.loc='all'; render(); } },
  hnext: () => { const d = allDates(); const i = d.indexOf(HQ.date); if(i > 0){ HQ.date = d[i-1]; HQ.loc='all'; render(); } },
  hclear:() => { HQ.q=''; render(); },
  hgo:   el => { HQ.date = el.dataset.v; HQ.mode='day'; HQ.loc='all'; go('history'); },
  hmonth:el => { const ym = el.dataset.v; const d = allDates().filter(x=>x.indexOf(ym)===0); if(d.length){ HQ.date=d[0]; HQ.mode='day'; render(); } },
  hedit: el => { const e = S.byEid.get(el.dataset.eid); if(e) countOpen(e.no, e.eid); },
  hdel:  el => deleteEntry(el.dataset.eid),

  /* items */
  itemDetail: el => { closeSheet(true); setTimeout(()=>itemDetail(el.dataset.no), 60); },
  itemNew:  () => itemForm(null),
  itemEdit: el => { closeSheet(true); setTimeout(()=>itemForm(el.dataset.no), 60); },
  igrp:  el => { IQ.grp = el.dataset.g; IQ.page = 1; render(); },
  igrp2: el => { IQ.grp = el.dataset.g; IQ.page = 1; go('items'); },
  iclear:() => { IQ.q=''; render(); },
  ipage: el => { IQ.page = +el.dataset.v; render(); window.scrollTo(0,0); },
  ifimgdel: el => { IF[el.dataset.k] = ''; refreshItemForm(); },

  /* more */
  expOpen: expOpen,
  varOpen: varOpen,
  help: helpSheet,
  syncNow: () => {
    if(!pendingCount()){ toast(S.online?'ข้อมูลซิงก์ครบแล้ว':'ออฟไลน์อยู่ แต่ไม่มีรายการค้าง'); return; }
    S.tries = 0; toast('กำลังส่ง...'); flush(true);
  },
  reload: async () => {
    if(pendingCount() && !await confirmBox('ยังมี '+pendingCount()+' รายการรอส่ง\nโหลดใหม่ได้ แต่ควรกด "ส่งข้อมูลเดี๋ยวนี้" ก่อน','โหลดใหม่')) return;
    busy(true,'กำลังโหลด...');
    try{ await loadAll(); toast('โหลดข้อมูลใหม่แล้ว'); render(); }
    catch(e){ toast('โหลดไม่สำเร็จ: '+e.message,'err'); }
    finally{ busy(false); }
  },
  chgUser: () => { $('login').style.display='flex'; $('loginName').value = S.user; setTimeout(()=>$('loginName').focus(),80); },
  login: doLogin
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const name = el.dataset.act;
  const local = _sheet && _sheet.onAct && _sheet.onAct[name];
  const fn = local || ACT[name];
  if(!fn) return;
  ev.preventDefault();
  fn(el, ev);
});
$('sheetBg').addEventListener('click', ev => { if(ev.target === $('sheetBg')) closeSheet(); });
$('lightbox').addEventListener('click', ev => { if(ev.target.id !== 'lbImg') $('lightbox').classList.remove('open'); });

/* input แบบ delegated (ไม่ใช้ inline oninput) */
let _searchT = null;
document.addEventListener('input', ev => {
  const id = ev.target.id;
  const set = (obj,key) => {
    obj[key] = ev.target.value;
    clearTimeout(_searchT);
    _searchT = setTimeout(()=>{
      const pos = ev.target.selectionStart;
      render();
      const again = $(id);
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    }, 220);
  };
  if(id==='cSearch'){ CQ.limit = 40; set(CQ,'q'); }
  else if(id==='sSearch') set(SQ,'q');
  else if(id==='hSearch') set(HQ,'q');
  else if(id==='iSearch'){ IQ.page = 1; set(IQ,'q'); }
});
document.addEventListener('change', ev => {
  if(ev.target.id === 'hDate'){ HQ.date = ev.target.value; HQ.loc='all'; render(); }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){
    if($('lightbox').classList.contains('open')) $('lightbox').classList.remove('open');
    else if(_sheet) closeSheet();
  }
  if(ev.key === 'Enter' && $('login').style.display !== 'none' && document.activeElement === $('loginName')) doLogin();
});
window.addEventListener('popstate', ev => {
  if(_sheet){ closeSheet(); return; }
  go((ev.state && ev.state.p) || 'count', false);
});
window.addEventListener('online',  ()=>{ S.online = true;  paintSync(); toast('กลับมาออนไลน์แล้ว'); flush(true); });
window.addEventListener('offline', ()=>{ S.online = false; paintSync(); toast('ออฟไลน์ — ข้อมูลจะถูกเก็บไว้ในเครื่องก่อน','warn'); });
window.addEventListener('beforeunload', ev => {
  if(pendingCount()){ ev.preventDefault(); ev.returnValue = ''; return ''; }
});
setInterval(()=>{ if(S.online && pendingCount() && !S.syncing) flush(); }, 45000);

/* ==================================================================
   BOOT
   ================================================================== */
function doLogin(){
  const inp = $('loginName');
  const name = (inp.value||'').trim();
  if(!name){ inp.style.borderColor = '#ff6b6b'; inp.focus(); return; }
  S.user = name;
  LS.set('user', name);
  $('login').style.display = 'none';
  render();
}

async function boot(){
  const logo = $('appLogo').href;
  ['bootLogo','hdrLogo','loginLogo'].forEach(id=>{ const e = $(id); if(e) e.src = logo; });

  loadQueue();
  const hadLocal = loadLocalFirst();
  S.user = LS.get('user','') || '';
  S.online = navigator.onLine;

  buildNav();
  const hash = (location.hash||'').replace('#','');
  const valid = ['count','stock','history','items','dash','more'];
  S.page = valid.indexOf(hash)>=0 ? hash : 'count';
  paintNav();
  paintSync();

  if(hadLocal){ S.loaded = true; render(); }
  $('boot').style.display = 'none';
  $('login').style.display = S.user ? 'none' : 'flex';
  if(S.user) render();

  try{
    $('bootMsg').textContent = 'กำลังโหลดข้อมูล...';
    await loadAll();
    render();
  }catch(e){
    S.loaded = true;
    if(hadLocal){
      toast('ใช้ข้อมูลในเครื่องก่อน (เชื่อมต่อ Sheet ไม่ได้)','warn');
    }else{
      $('view').innerHTML = emptyBox('📡','เชื่อมต่อ Google Sheet ไม่ได้', e.message)+
        '<div style="text-align:center"><button class="btn btn-primary" data-act="reload">ลองอีกครั้ง</button></div>';
    }
    console.error(e);
  }
  if(pendingCount()) flush();
}
boot();
